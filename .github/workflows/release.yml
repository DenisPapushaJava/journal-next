name: Release
on:
  push:
    tags: ['workflow-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия Windows-выпуска'
        required: true
        default: '2026.1.0-alpha.7'
        type: string
      create_draft:
        description: 'После проверок создать тег и черновик выпуска'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
jobs:
  package:
    name: Windows installer and update
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Require commit from the Next main branch
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to Next main.' }
      - id: version
        env:
          NEXT_VERSION: ${{ inputs.version || github.ref_name }}
        run: python scripts/release.py plan --version "$env:NEXT_VERSION" --github-output "$env:GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: artifacts/installer-dependencies
          key: next-installer-${{ hashFiles('installer/windows/dependencies.json') }}
      - run: python -m unittest discover -s tests/release -v
      - run: dotnet restore Journal.Next.slnx --locked-mode
      - run: dotnet restore tests/Fixtures/UpdateProbe/Journal.Next.UpdateProbe.csproj --locked-mode
      - run: dotnet build Journal.Next.slnx -c Release --no-restore
      - run: dotnet test tests/Jornal.Workflow.Tests/Jornal.Workflow.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release.py package --version "$env:NEXT_VERSION"
      - env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/test-windows-install.ps1 -Version "$env:NEXT_VERSION"
      - env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release.py verify --version "$env:NEXT_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-release
          path: artifacts/release/*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-installation-diagnostics
          path: |
            artifacts/test-results/*.trx
            artifacts/installer-logs/*
          retention-days: 14
          if-no-files-found: ignore
  draft:
    name: Draft after verified Windows installation
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/workflow-v')) || (github.event_name == 'workflow_dispatch' && inputs.create_draft)
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-release
          path: artifacts/release
      - env:
          NEXT_VERSION: ${{ needs.package.outputs.version }}
        run: python scripts/release.py verify --version "$env:NEXT_VERSION"
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXT_VERSION: ${{ needs.package.outputs.version }}
          NEXT_TAG: ${{ needs.package.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = & gh release view $env:NEXT_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'A release with this tag already exists; never replace published assets automatically.' }
          $tagSha = & gh api "repos/$env:GH_REPO/git/ref/tags/$env:NEXT_TAG" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($tagSha -ne $env:GITHUB_SHA) { throw 'Existing tag belongs to another commit.' }
          } else {
            & gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$env:NEXT_TAG" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Creating the verified release tag failed.' }
          }
          & python scripts/release.py notes --version $env:NEXT_VERSION --notes-output (Join-Path $env:RUNNER_TEMP 'next-notes.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Reading approved release notes failed.' }
          $assets = @(Get-ChildItem artifacts/release -File | Select-Object -ExpandProperty FullName)
          & gh release create $env:NEXT_TAG @assets --draft --verify-tag --prerelease --title "Заявки $env:NEXT_VERSION" --notes-file (Join-Path $env:RUNNER_TEMP 'next-notes.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed.' }
